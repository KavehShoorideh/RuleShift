[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruleshift"
version = "0.1.0"
description = "Concept survival and localized adaptation across game rule spaces: m,n,k-game harness with exact solvers"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["torch>=2.2", "matplotlib>=3.8"]
dev = ["pytest>=8", "torch>=2.2", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ruleshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not frontier'"
markers = [
    "slow: heavier known-result checks, ~5s-2min each (run with: pytest -m slow)",
    "frontier: beyond pure-Python v1 solver reach, see docs/benchmarks.md (pytest -m frontier)",
]
